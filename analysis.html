/* 全量月份轴 2026-01 -> 最新 */
const M_RANGE = (() => {
  let end = '2026-01';
  DATA.projects.forEach(p => p.月度走势.forEach(d => { if (d.month > end) end = d.month; }));
  const keys = []; let y = 2026, m = 1;
  while (true) {
    const k = y + '-' + String(m).padStart(2, '0');
    keys.push(k); if (k === end) break;
    m++; if (m > 12) { m = 1; y++; }
  }
  return keys;
})();
const MONTHS = M_RANGE.map(k => k.slice(5) + '月');

/* ---------- 重点一:整体环比 ---------- */
const cmp = DATA.projects.map(p => {
  const wd = p.月度走势;
  if (!wd.length) return null;
  const cur = wd[wd.length - 1], prev = wd.length > 1 ? wd[wd.length - 2] : null;
  if (!prev) return null;
  const chg = (cur.成交均价 - prev.成交均价) / prev.成交均价 * 100;
  return { name: p.name, chg, curMonth: cur.month.slice(5) + '月', curPrice: cur.成交均价 };
}).filter(x => x);

const dn = cmp.filter(x => x.chg < -0.05).length;

  const curM = p.月度走势[p.月度走势.length - 1].month.slice(5) + '月';
  const drop = ((cur - ymax) / ymax * 100).toFixed(1);
  const lastChg = i === 4 ? '' : '';  /* 环比已在重点一体现 */

  const card = document.createElement('div');
  card.className = 'pcard ' + (i < 3 ? 'w2' : 'w3');
  card.innerHTML =
    '<div class="ptitle">' + p.name + '<span class="bk" style="background:' +
      ({'龙潭寺':'#e0564f','北湖':'#4c7dd0','八里庄':'#3aa383','成都理工':'#d99a2b','动物园':'#2f9e9e','崔家店':'#7d6fd0','熊猫基地':'#b569b8','保和':'#e2814c'}[p.板块] || '#666') +
      '">' + p.板块 + '</span></div>' +
    '<div class="pbadge">最新月(' + curM + ')均价 <b>' + cur + '</b> 元/㎡ · 较年内高点回落 ' + Math.abs(drop) + '%</div>' +
    '<div class="pchart" id="pc' + i + '"></div>';
  grid.appendChild(card);
});

/* 逐个渲染(卡片已入DOM) */
TYPICAL.forEach((name, i) => {
  const p = DATA.projects.find(x => x.name === name);
  const byKey = {};
  p.月度走势.forEach(d => byKey[d.month] = d);
  const vols = M_RANGE.map(k => byKey[k] ? byKey[k].成交量 : 0);
  const prices = M_RANGE.map(k => byKey[k] ? byKey[k].成交均价 : null);
  const ch = echarts.init(document.getElementById('pc' + i));
  ch.setOption({
    animation: false,
    grid: { left: 40, right: 8, top: 26, bottom: 20 },
    legend: { top: 0, left: 2, itemWidth: 12, itemHeight: 6, itemGap: 8, textStyle: { fontSize: 10, color: '#666' } },
    tooltip: { trigger: 'axis', textStyle: { fontSize: 11 } },
    xAxis: { type: 'category', data: MONTHS, axisLabel: { fontSize: 10, color: '#888', interval: 0 },
             axisTick: { show: false }, axisLine: { lineStyle: { color: '#e4e6ee' } } },
    yAxis: [
      { type: 'value', name: '套', nameTextStyle: { fontSize: 9, color: '#999' },
        axisLabel: { fontSize: 9, color: '#999' }, splitLine: { lineStyle: { color: '#f1f2f6' } } },
      { type: 'value', scale: true, name: '元/㎡', position: 'right', nameTextStyle: { fontSize: 9, color: '#999' },
        axisLabel: { fontSize: 9, color: '#999', formatter: v => v >= 10000 ? (v / 1000) + 'k' : v },
        splitLine: { show: false } }
    ],
    series: [
      { name: '成交套数', type: 'bar', yAxisIndex: 0, barWidth: '42%',
        data: vols, itemStyle: { color: '#9db8e0', borderRadius: [2, 2, 0, 0] },
        label: { show: true, position: 'top', fontSize: 10, color: '#5b8bd6',
                 formatter: x => x.value === 0 ? '' : x.value } },
      { name: '成交均价', type: 'line', yAxisIndex: 1, symbolSize: 5, connectNulls: false,
        data: prices, itemStyle: { color: '#e0564f' }, lineStyle: { width: 2.5 },
        markPoint: { symbol: 'circle', symbolSize: 7, label: { show: false },
                     data: [{ type: 'max', name: '年内高点' }],
                     itemStyle: { color: '#e0564f', borderColor: '#fff', borderWidth: 1.5 } },
        label: { show: true, position: 'top', distance: 6, fontSize: 10, color: '#d24a43',
                 textBorderColor: '#fff', textBorderWidth: 2,
                 formatter: x => x.value == null ? '' : x.value } }
    ]
  });
  charts.push(ch);
});
</script>
</body>
</html>
