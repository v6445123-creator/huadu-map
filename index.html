<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华都项目 · 二手监测地图</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body,#map { width:100%; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; }

  /* ---- 左上信息面板 ---- */
  .panel { position:fixed; top:16px; left:16px; z-index:200; background:#fff; border-radius:12px;
           box-shadow:0 4px 20px rgba(0,0,0,.12); padding:14px 16px 12px; width:264px; }
  .panel h1 { font-size:17px; color:#1a1a2e; letter-spacing:.5px; }
  .panel h1 em { font-style:normal; color:#3f6fd8; }
  .panel .sub { font-size:11px; color:#888; margin-top:4px; line-height:1.5; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
  .chip { font-size:11px; padding:3px 9px; border-radius:20px; cursor:pointer; border:1px solid transparent;
          color:#fff; user-select:none; transition:opacity .15s, transform .15s; }
  .chip:hover { transform:translateY(-1px); }
  .chip.off { opacity:.25; filter:grayscale(.6); }
  .chip.all { background:#4a4a68 !important; }
  .panel .note { font-size:10px; color:#aaa; margin-top:10px; line-height:1.6; border-top:1px dashed #eee; padding-top:8px; }

  /* ---- 自定义标记 ---- */
  .mk { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .mk-label { font-size:11px; line-height:1; padding:4px 7px; border-radius:4px; color:#fff; white-space:nowrap;
              background:var(--c); box-shadow:0 1px 4px rgba(0,0,0,.25); margin-bottom:3px; font-weight:600; }
  .mk-dot { width:11px; height:11px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.35);
            transition:transform .12s; }
  .mk:hover .mk-dot { transform:scale(1.7); }
  .mk:hover .mk-label { filter:brightness(1.12); }

  /* ---- 右侧详情卡 ---- */
  .card { position:fixed; top:16px; right:16px; bottom:16px; width:682px; z-index:300;
          background:#fff; border-radius:14px; box-shadow:0 8px 32px rgba(0,0,0,.18);
          transform:translateX(720px); opacity:0; transition:transform .28s cubic-bezier(.2,.8,.25,1), opacity .2s;
          display:flex; flex-direction:column; overflow:hidden; }
  .card.show { transform:translateX(0); opacity:1; }
  .card-scroll { padding:12px 18px 10px; flex:1; overflow:hidden; }

  .card-head { display:flex; align-items:flex-start; gap:8px; }
  .card-title { font-size:18px; font-weight:700; color:#1a1a2e; line-height:1.35; flex:1; }
  .bk-tag { display:inline-block; font-size:11px; font-weight:600; color:#fff; padding:2px 8px;
            border-radius:4px; vertical-align:2px; margin-left:6px; }
  .card-close { border:none; background:#f2f3f7; color:#888; width:24px; height:24px; border-radius:50%;
                font-size:14px; cursor:pointer; line-height:1; flex:none; }
  .card-close:hover { background:#e2e4ea; color:#333; }

  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .tile { background:#f7f8fb; border-radius:8px; padding:8px 10px; }
  .t-label { font-size:10px; color:#96a; color:#969cab; }
  .t-val { font-size:16px; font-weight:700; color:#24243c; margin-top:2px; }
  .t-sub { font-size:10px; font-weight:400; color:#999; }
  .listing-tile { background:#fff4e8; border:1px solid #ffd9b3; border-radius:8px; padding:10px 14px;
                  margin-top:12px; display:flex; align-items:center; justify-content:space-between; }
  .lt-label { font-size:13px; color:#a8683a; font-weight:600; }
  .lt-val { font-size:28px; font-weight:800; color:#ef8b2f; line-height:1; }
  .lt-sub { font-size:11px; font-weight:400; color:#c99a6a; margin-left:4px; }

  /* ---- 模块区隔与图标 ---- */
  .mod-title { display:flex; align-items:center; gap:10px; margin:12px 0 6px;
               font-size:13px; font-weight:700; color:#1a1a2e; }
  .mod-title::after { content:''; flex:1; height:1px; background:#e8eaf1; }
  .mod-title .sec-sub { font-weight:400; color:#999; font-size:10px; white-space:nowrap; }
  .ik { display:inline-block; width:15px; height:15px; margin-right:6px; vertical-align:-3px; color:#8a93a6; }
  .ik svg { width:100%; height:100%; display:block; }
  .trend-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:6px 0 2px; }
  .ts-item { background:#f7f8fb; border-radius:6px; padding:5px 9px; }
  .ts-k { font-size:10px; color:#969cab; white-space:nowrap; }
  .ts-v { font-size:13px; font-weight:700; color:#24243c; margin-top:2px; white-space:nowrap; }

  /* ---- 最新月成交一览表 ---- */
  .mtable { width:100%; border-collapse:separate; border-spacing:0; margin-top:2px; font-size:12px; }
  .mtable th { background:#eef2fa; color:#4a5568; font-weight:600; padding:7px 8px; text-align:center; white-space:nowrap; }
  .mtable th:first-child { border-radius:8px 0 0 0; text-align:left; padding-left:10px; }
  .mtable th:last-child { border-radius:0 8px 0 0; }
  .mtable td { padding:4px 8px; text-align:center; border-bottom:1px solid #f1f3f8; color:#333; }
  .mtable td.pname { text-align:left; padding-left:10px; font-weight:600; color:#24243c; }
  .mtable tr:last-child td { border-bottom:none; }
  .mtable tbody tr:hover td { background:#f8faff; }
  .up { color:#e0564f; font-weight:700; }
  .down { color:#3aa383; font-weight:700; }
  .flat { color:#98a0ad; }
  .msub { font-size:10px; color:#adb2bd; margin-left:4px; font-weight:400; white-space:nowrap; }

  /* ---- 本项目波纹标记 ---- */
  .self-dot { display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .self-label { font-size:11px; font-weight:700; color:#fff; background:linear-gradient(135deg,#ef8b2f,#e0564f);
                padding:4px 9px; border-radius:4px; margin-bottom:4px; white-space:nowrap;
                box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .self-body { position:relative; width:18px; height:18px; }
  .self-body .ring { position:absolute; inset:-3px; border-radius:50%; border:2.5px solid #ef8b2f;
                     animation:ripple 1.8s ease-out infinite; }
  .self-body .ring.r2 { animation-delay:.9s; border-color:#e0564f; }
  .self-body .core { position:absolute; inset:2px; border-radius:50%;
                     background:linear-gradient(135deg,#ef8b2f,#e0564f);
                     border:2px solid #fff; box-shadow:0 0 10px rgba(239,139,47,.95); }
  @keyframes ripple { 0% { transform:scale(.5); opacity:1; } 100% { transform:scale(2.8); opacity:0; } }

  /* ---- 整体面板收起/重开按钮(仅手机端) ---- */
  .overall-close { display:none; }
  .reopen { display:none; position:fixed; right:12px; bottom:12px; z-index:250;
            border:none; background:#fff; color:#3f6fd8; font-size:13px; font-weight:700;
            padding:10px 14px; border-radius:22px; box-shadow:0 4px 16px rgba(0,0,0,.18); cursor:pointer; }

  /* ---- 手机端自适应 ---- */
  @media (max-width: 768px) {
    .panel { top:8px; left:8px; right:8px; width:auto; padding:10px 12px 8px; }
    .panel h1 { font-size:15px; }
    .panel .sub { font-size:10px; margin-top:2px; }
    .panel .note { display:none; }
    .chips { margin-top:6px; }
    .chip { font-size:10px; padding:2px 7px; }
    .card { top:auto; left:0; right:0; bottom:0; width:auto; max-height:64vh;
            border-radius:14px 14px 0 0; transform:translateY(110%); }
    .card.show { transform:translateY(0); }
    .card-scroll { overflow-y:auto; padding:12px 14px; -webkit-overflow-scrolling:touch; }
    .card-title { font-size:16px; }
    .listing-tile { padding:8px 12px; }
    .lt-val { font-size:22px; }
    .lt-val .lt-sub { display:block; margin:2px 0 0; }
    .trend-stats { grid-template-columns:1fr 1fr; }
    .ts-v { white-space:normal; word-break:break-all; }
    #chart { height:200px; }
    .overall-close { display:block; }
    .reopen { display:block; }
  }

  .info { width:100%; border-collapse:collapse; margin-top:2px; }
  .info td { font-size:12px; padding:4px 2px; vertical-align:top; }
  .info td.k { color:#969cab; width:120px; white-space:nowrap; }
  .info td.v { color:#333; font-weight:500; }
  .feature { font-size:12px; color:#444; background:#f7f8fb; border-left:3px solid #3f6fd8;
             padding:8px 10px; border-radius:0 6px 6px 0; margin-top:10px; line-height:1.6; }

  .sec-title { font-size:13px; font-weight:700; color:#1a1a2e; margin-top:14px; }
  .sec-sub { font-size:10px; font-weight:400; color:#999; margin-left:6px; }
  #chart { width:100%; height:230px; margin-top:2px; }
  .chart-empty { height:80px; display:flex; align-items:center; justify-content:center; color:#b0b3bf; font-size:12px;
                 background:#f7f8fb; border-radius:8px; margin-top:8px; }
  .card-foot { font-size:10px; color:#b0b3bf; line-height:1.6; margin-top:10px; border-top:1px dashed #eee; padding-top:8px; }
  .gap { color:#d24545; }

  /* ---- 加载失败提示 ---- */
  .err { position:fixed; inset:0; z-index:999; display:none; align-items:center; justify-content:center;
         background:#f4f5f9; color:#666; font-size:14px; text-align:center; line-height:2; }
</style>
</head>

const allChip = document.createElement('span');
allChip.className = 'chip all'; allChip.textContent = '全部';
allChip.onclick = () => { Object.keys(chipState).forEach(k => chipState[k] = true);
  syncChips(); markers.forEach(m => m.show()); };
chipBox.appendChild(allChip);
Object.keys(BK_COLOR).forEach(bk => {
  chipState[bk] = true;
  const c = document.createElement('span');
  c.className = 'chip'; c.textContent = bk; c.style.background = BK_COLOR[bk];
  c.onclick = () => {
    chipState[bk] = !chipState[bk];
    syncChips();
    markers.forEach((m, i) => { if (DATA.projects[i].板块 === bk) chipState[bk] ? m.show() : m.hide(); });
  };
  chipBox.appendChild(c);
});
function syncChips() {
  [...chipBox.querySelectorAll('.chip')].forEach(el => {
    const bk = el.textContent;
    if (bk !== '全部') el.classList.toggle('off', !chipState[bk]);
  });
  allChip.textContent = Object.values(chipState).every(v => v) ? '全部' : '部分';
}

const M_RANGE = (() => {
  let end = '2026-01';
  DATA.projects.forEach(p => p.月度走势.forEach(d => { if (d.month > end) end = d.month; }));
  const keys = [];
  let y = 2026, m = 1;
  while (true) {
    const k = y + '-' + String(m).padStart(2, '0');
    keys.push(k);
    if (k === end) break;
    m++; if (m > 12) { m = 1; y++; }

  return keys;
})();

    ],
    series: [
      { name: '成交套数', type: 'bar', yAxisIndex: 0, barWidth: '42%',
        data: vols, itemStyle: { color: '#5b8bd6', borderRadius: [2, 2, 0, 0] },
        label: { show: true, position: 'insideTop', fontSize: 11,
                 formatter: x => x.value === 0 ? '' : '{w|' + x.value + '}',
                 rich: { w: { color: '#fff', fontSize: 11, fontWeight: 600, align: 'center' } } } },
      { name: '成交均价', type: 'line', yAxisIndex: 1, symbolSize: 6, connectNulls: false,
        data: prices, itemStyle: { color: '#e0564f' }, lineStyle: { width: 2 },
        label: { show: true, position: 'top', distance: 7, fontSize: 11, color: '#e0564f',
                 textBorderColor: '#fff', textBorderWidth: 2,
                 formatter: x => x.value == null ? '' : x.value } },
      { name: '套均总价', type: 'line', yAxisIndex: 2, symbolSize: 6, connectNulls: false,
        data: totals, itemStyle: { color: '#3aa383' },
        lineStyle: { width: 2, type: 'dashed' },
        label: { show: true, position: 'top', distance: 7, fontSize: 11, color: '#2e9178',
                 textBorderColor: '#fff', textBorderWidth: 2 } }
    ]
  };
}

function renderChartBlock(el, months, vols, prices, totals, volMax) {
  if (chart) { chart.dispose(); chart = null; }
  if (!window.echarts) {
    el.outerHTML = '<div class="chart-empty">图表库加载失败,请检查网络后刷新</div>';
    return;
  }
  chart = echarts.init(el);
  chart.setOption(chartOption(months, vols, prices, totals, volMax));
}

/* 整体统计面板:未点击项目时的首页视图 */
function renderOverall() {
  if (chart) { chart.dispose(); chart = null; }
  const covered = DATA.projects.filter(p => p.在售挂牌量 != null).length;
  const listingSum = DATA.projects.reduce((s, p) => s + (p.在售挂牌量 || 0), 0);

  /* 各项目最新有成交月份的套数/均价/环比 */
  const msub = t => '<span class="msub">' + t + '</span>';
  const rows = DATA.projects.map(p => {
    const wd = p.月度走势;
    const cur = wd[wd.length - 1], prev = wd.length > 1 ? wd[wd.length - 2] : null;
    let huanbi = '<span class="flat">—</span>';
    if (cur && prev && prev.成交均价) {
      const chg = (cur.成交均价 - prev.成交均价) / prev.成交均价 * 100;
      if (chg > 0.05) huanbi = '<span class="up">↑' + chg.toFixed(1) + '%</span>';
      else if (chg < -0.05) huanbi = '<span class="down">↓' + Math.abs(chg).toFixed(1) + '%</span>';
      else huanbi = '<span class="flat">0.0%</span>';
      huanbi += msub('上月' + prev.month.slice(5) + '月 ' + prev.成交均价);
    }
    const volCell = cur ? cur.成交量 : '<span class="flat">—</span>';
    const priceCell = cur ? cur.成交均价 : '<span class="flat">—</span>';
    return { p, volCell, priceCell, huanbi };
  }).sort((a, b) => {
    const va = parseInt(String(a.volCell), 10) || -1, vb = parseInt(String(b.volCell), 10) || -1;
    return vb - va;
  });

  const trs = rows.map(r =>
    '<tr>' +
    '<td class="pname">' + r.p.name + '</td>' +
    '<td>' + r.volCell + '</td>' +
    '<td>' + r.priceCell + '</td>' +
    '<td>' + r.huanbi + '</td>' +
    '</tr>').join('');

  const latestMonth = M_RANGE[M_RANGE.length - 1].slice(5) + '月';

  scroll.innerHTML =
    '<div class="card-head"><div class="card-title">整体统计' +
      '<span class="bk-tag" style="background:#4a4a68">' + DATA.projects.length + '个对标小区</span></div>' +
      '<button class="card-close overall-close" title="收起面板,查看完整地图">×</button></div>' +
    '<div class="listing-tile"><span class="lt-label">在售挂牌量(120-150万)</span>' +
      '<span class="lt-val">' + listingSum +
      '<span class="lt-sub">套 · ' + covered + '/' + DATA.projects.length + '个小区有数据</span></span></div>' +
    '<div class="mod-title">最新月成交一览<span class="sec-sub">环比=较上一成交月均价 · 按套数排序</span></div>' +
    '<table class="mtable">' +
    '<thead><tr><th>楼盘</th><th>' + latestMonth + '成交套数(套)</th><th>' + latestMonth + '成交均价(元/㎡)</th><th>均价环比</th></tr></thead>' +
    '<tbody>' + trs + '</tbody></table>' +
    '<div class="card-foot">点击地图上的小区标记可查看单盘详情 · 数据来源:监测表</div>';

  card.classList.add('show');
  const oc = card.querySelector('.overall-close');
  if (oc) oc.onclick = () => card.classList.remove('show');
}

function closeCard() { renderOverall(); }

function openCard(p) {
  const color = BK_COLOR[p.板块] || '#666';
  const gaps = p.数据缺口 || [];
  const trendEmpty = !p.月度走势.length;

  const infoRow = (k, v) => '<tr><td class="k">' +
    (ICONS[k] ? '<span class="ik">' + ICONS[k] + '</span>' : '') + k +
    '</td><td class="v">' + esc(v) + '</td></tr>';
  const hushu = (p.总户数 == null || isNaN(p.总户数)) ? esc(p.总户数) : esc(p.总户数) + ' 户';

  /* 月度量价整体统计 */
  const wd = p.月度走势;
  const totalVol = wd.reduce((s, d) => s + d.成交量, 0);
  let priceRange = '—', totalRange = '—';
  if (wd.length) {
    const ps = wd.map(d => d.成交均价), tss = wd.map(d => d.套均总价);
    priceRange = Math.min(...ps) + ' ~ ' + Math.max(...ps);
    totalRange = Math.min(...tss) + ' ~ ' + Math.max(...tss);
  }
  const trendStats =
    '<div class="trend-stats">' +
    '<div class="ts-item"><div class="ts-k">累计成交</div><div class="ts-v">' + totalVol + ' 套</div></div>' +
    '<div class="ts-item"><div class="ts-k">有成交月份</div><div class="ts-v">' + wd.length + ' / ' + M_RANGE.length + ' 月</div></div>' +
    '<div class="ts-item"><div class="ts-k">均价区间(元/㎡)</div><div class="ts-v">' + priceRange + '</div></div>' +
    '<div class="ts-item"><div class="ts-k">总价区间(万元)</div><div class="ts-v">' + totalRange + '</div></div>' +
    '</div>';

  scroll.innerHTML =
    '<div class="card-head"><div class="card-title">' + p.name +
      '<span class="bk-tag" style="background:' + color + '">' + p.板块 + '</span></div>' +
      '<button class="card-close" title="关闭">×</button></div>' +
    '<div class="listing-tile"><span class="lt-label">在售挂牌量(120-150万)</span>' +
      '<span class="lt-val">' + (p.在售挂牌量 == null ? '—' : esc(p.在售挂牌量)) +
      '<span class="lt-sub">' + (p.在售挂牌量 == null ? '表内无本盘' : '套') + '</span></span></div>' +
    '<div class="mod-title">项目详情</div>' +
    '<table class="info">' +
      infoRow('建成年代', p.建成年代) + infoRow('总户数', hushu) +
      infoRow('楼栋数', p.楼栋数) + infoRow('建筑类型', p.建筑类型) + infoRow('容积率', p.容积率) +
      infoRow('绿化率', p.绿化率) + infoRow('物业费(元/㎡·月)', p.物业费) +
      infoRow('小区特征', p.小区特征) +
    '</table>' +
    '<div class="mod-title">月度量价走势<span class="sec-sub">2026年1月起逐月 · 无成交月份断线</span></div>' +
    trendStats +
    '<div id="chart"></div>' +
    '<div class="card-foot">' +
      (gaps.length ? '<span class="gap">※ ' + gaps.join(';') + '</span><br>' : '') +
      '数据来源:链家/安居客/58爱房/房天下等(小区信息),成交及挂牌数据来自监测表</div>';

  card.querySelector('.card-close').onclick = closeCard;
  card.classList.add('show');
  /* 渲染图表(等卡片完成布局) */
  setTimeout(() => {
    const el = document.getElementById('chart');
    if (!el) return;
    if (chart) { chart.dispose(); chart = null; }
    if (trendEmpty) {
      el.outerHTML = '<div class="chart-empty">暂无本盘月度成交数据</div>';
      return;
    }
    const byKey = {};
    p.月度走势.forEach(d => { byKey[d.month] = d; });
    renderChartBlock(el,
      M_RANGE.map(k => k.slice(5) + '月'),
      M_RANGE.map(k => byKey[k] ? byKey[k].成交量 : 0),
      M_RANGE.map(k => byKey[k] ? byKey[k].成交均价 : null),
      M_RANGE.map(k => byKey[k] ? byKey[k].套均总价 : null),
      15);
  }, 60);
}

/* 点击地图空白处回到整体统计 */
map.on('click', closeCard);

/* 首屏默认呈现整体统计 */
renderOverall();

/* 手机端:收起面板后可通过浮动按钮重新打开 */
document.getElementById('reopenBtn').onclick = renderOverall;

/* 比例尺控件异步加载,失败不影响主功能 */
try {
  AMap.plugin('AMap.Scale', () => {
    try { map.addControl(new AMap.Scale({ position: { bottom: '24px', left: '24px' } })); } catch (e) {}
  });
} catch (e) {}
</script>
</body>
</html>
